name: Repository checks
on:
  push:
  pull_request:
jobs:
  stdlib-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic event-operator tests
        run: python -m unittest discover -s tests -v
      - name: Rounded result-ledger checks
        run: python scripts/check_result_ledger.py
